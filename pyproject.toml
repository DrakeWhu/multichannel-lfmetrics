# pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multichannel-lfmetrics"
version = "0.1.0"
description = "Particle and beam metrics for 3D WarpX multichannel CNT / solid-density simulations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "h5py",
    "matplotlib",
]

[project.scripts]
lfmetrics = "lfmetrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
